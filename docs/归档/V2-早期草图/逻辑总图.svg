<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1530" viewBox="0 0 1640 1530" role="img" aria-labelledby="title desc">
  <title id="title">OperMind V2 Agent 平台逻辑总图</title>
  <desc id="desc">目标结构与当前实现状态。主 Agent 通过能力挂载扩展；子任务委派和独立主 Agent 协作是平行维度。LangGraph 已有，LangChain 与 Deep Agents 是候选；所有工具调用经过工具网关。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5c7181"/></marker>
    <style>
      text { font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",sans-serif; fill:#203343; }
      .title { font-size:32px; font-weight:700; }
      .section { font-size:22px; font-weight:700; }
      .name { font-size:21px; font-weight:700; }
      .body { font-size:18px; }
      .small { font-size:16px; fill:#526775; }
      .tag { font-size:15px; font-weight:700; }
      .panel { fill:#f7f9fb; stroke:#d4dfe7; stroke-width:1.5; }
      .reuse { fill:#ecf8f4; stroke:#2d7d70; stroke-width:1.8; }
      .adapt { fill:#edf4fa; stroke:#47758b; stroke-width:1.8; }
      .plan { fill:#fff; stroke:#778b9a; stroke-width:1.8; stroke-dasharray:7 5; }
      .candidate { fill:#fff8eb; stroke:#a17b36; stroke-width:1.8; stroke-dasharray:7 5; }
      .defer { fill:#f3f4f6; stroke:#95a2ad; stroke-width:1.5; stroke-dasharray:3 5; }
      .edge { fill:none; stroke:#5c7181; stroke-width:2; marker-end:url(#arrow); }
      .optional { stroke-dasharray:7 5; }
      .both { marker-start:url(#arrow); }
    </style>
  </defs>
  <rect width="1640" height="1530" fill="#fff"/>
  <text x="40" y="51" class="title">OperMind V2 · Agent 平台逻辑总图</text>
  <text x="40" y="84" class="body">目标结构 + 当前状态 · 2026-10-09 · V1 基线 6706caa · 本图不代表 V2 已实现</text>
  <g transform="translate(40 110)">
    <rect class="reuse" width="178" height="37" rx="6"/><text x="15" y="25" class="tag">已有 / 优先复用</text>
    <rect x="195" class="adapt" width="163" height="37" rx="6"/><text x="210" y="25" class="tag">已有起点 / 适配</text>
    <rect x="375" class="plan" width="142" height="37" rx="6"/><text x="390" y="25" class="tag">计划 / 待建设</text>
    <rect x="534" class="candidate" width="158" height="37" rx="6"/><text x="549" y="25" class="tag">候选 / 待验证</text>
    <rect x="709" class="defer" width="151" height="37" rx="6"/><text x="724" y="25" class="tag">后置 / 按需立项</text>
    <text x="910" y="25" class="small">实线：调用或结果流　虚线：可选路径　状态以文字为准</text>
  </g>
  <text x="60" y="190" class="section">任务运行结构</text>
  <rect x="420" y="210" width="420" height="91" rx="10" class="adapt"/>
  <text x="444" y="240" class="name">会话工作台 · 任务与结果展示</text>
  <text x="444" y="268" class="body">V1 已有；V2 重构页面职责与交互</text>
  <text x="444" y="291" class="small">仅调用正式后端 API</text>

  <rect x="40" y="342" width="1120" height="218" rx="12" class="panel"/>
  <text x="61" y="373" class="section">应用控制与装配 · 我们维护产品语义</text>
  <rect x="60" y="395" width="300" height="134" rx="8" class="reuse"/>
  <text x="80" y="426" class="name">会话 / 模型 / Run 服务</text>
  <text x="80" y="455" class="body">V1 复用与适配</text>
  <text x="80" y="481" class="small">消息、模型绑定、运行记录</text>
  <text x="80" y="506" class="small">SSE、审计与受控审批</text>
  <rect x="420" y="395" width="420" height="134" rx="8" class="plan"/>
  <text x="441" y="426" class="name">Agent 定义 / Capability 注册</text>
  <text x="441" y="455" class="body">待建设：职责、能力包、版本与资源绑定</text>
  <text x="441" y="481" class="small">配置可复用；本次执行固定配置与能力版本</text>
  <text x="441" y="506" class="small">能力声明不等于执行授权</text>
  <rect x="900" y="395" width="240" height="134" rx="8" class="plan"/>
  <text x="918" y="426" class="name">上下文 / 任务 / 结果</text>
  <text x="918" y="455" class="body">待建设：最小契约</text>
  <text x="918" y="481" class="small">状态隔离、预算与取消</text>
  <text x="918" y="506" class="small">结果归属、产物引用</text>

  <path d="M 630 301 V 321 H 49 V 447 H 60" class="edge"/>
  <path d="M 210 529 V 589 H 520 V 635" class="edge"/>
  <path d="M 630 529 V 635" class="edge"/>
  <path d="M 1020 529 V 589 H 740 V 635" class="edge"/>
  <text x="62" y="613" class="small">同一套执行机制支持四种组合；只装配本次任务需要的能力</text>

  <rect x="60" y="635" width="300" height="106" rx="9" class="plan"/>
  <text x="80" y="667" class="name">Skill / Capability 挂载</text>
  <text x="80" y="695" class="body">待建设：按需加载指引与能力</text>
  <text x="80" y="721" class="small">可封装 Tool 或小目标 Workflow</text>
  <rect x="420" y="635" width="420" height="106" rx="9" class="adapt"/>
  <text x="441" y="667" class="name">通用主 Agent A · 默认执行单元</text>
  <text x="441" y="695" class="body">已有领域 ReAct 起点；V2 需通用化适配</text>
  <text x="441" y="721" class="small">模型结构化判断 → 程序校验 → 执行</text>
  <rect x="900" y="635" width="240" height="106" rx="9" class="plan"/>
  <text x="918" y="667" class="name">独立业务主 Agent B</text>
  <text x="918" y="695" class="body">待建设：独立任务状态</text>
  <text x="918" y="721" class="small">独立上下文与交付责任</text>
  <path d="M 360 684 H 420" class="edge optional"/>

  <rect x="420" y="793" width="420" height="110" rx="9" class="plan"/>
  <text x="441" y="825" class="name">子 Agent · 同一业务内的任务委派</text>
  <text x="441" y="854" class="body">待建设：隔离上下文，结果回交父任务</text>
  <text x="441" y="881" class="small">父主 Agent 汇总并负责最终交付</text>
  <path d="M 630 741 V 793" class="edge optional both"/>
  <text x="651" y="774" class="small">委派 / 回交</text>

  <rect x="900" y="793" width="240" height="110" rx="9" class="plan"/>
  <text x="918" y="825" class="name">主 Agent 协作协议</text>
  <text x="918" y="854" class="body">待建设：请求 / 响应</text>
  <text x="918" y="881" class="small">关联、超时、重复处理</text>
  <path d="M 840 685 H 864 V 848 H 900" class="edge optional both"/>
  <path d="M 1020 741 V 793" class="edge optional both"/>

  <text x="80" y="813" class="name">两个平行维度</text>
  <text x="80" y="846" class="body">任务复杂度 / 上下文隔离</text>
  <text x="80" y="875" class="body">业务独立性 / 按需协作</text>
  <text x="80" y="903" class="small">可分别启用，也可组合；不是升级阶梯</text>

  <rect x="60" y="962" width="300" height="120" rx="9" class="plan"/>
  <text x="80" y="993" class="name">Workflow · 一个小业务目标</text>
  <text x="80" y="1023" class="body">待建设：结构化输入与输出</text>
  <text x="80" y="1051" class="small">程序步骤、模型、工具可以组合</text>
  <rect x="420" y="962" width="420" height="120" rx="9" class="reuse"/>
  <text x="441" y="993" class="name">ToolGateway · 唯一受控工具入口</text>
  <text x="441" y="1023" class="body">V1 复用：参数、权限、超时、脱敏</text>
  <text x="441" y="1051" class="small">任何 Agent 的工具调用都受相同边界约束</text>
  <rect x="900" y="962" width="240" height="120" rx="9" class="adapt"/>
  <text x="918" y="993" class="name" style="font-size:19px">Connector / 资源绑定</text>
  <text x="918" y="1023" class="body">运维适配已有</text>
  <text x="918" y="1051" class="small">新业务数据源按需扩展</text>
  <path d="M 420 720 H 388 V 929 H 210 V 962" class="edge"/>
  <text x="82" y="945" class="small">选择已有能力</text>
  <path d="M 800 741 V 758 H 871 V 931 H 750 V 962" class="edge"/>
  <path d="M 630 903 V 962" class="edge"/>
  <path d="M 1140 685 H 1172 V 927 H 814 V 962" class="edge"/>
  <path d="M 360 1022 H 420" class="edge"/>
  <path d="M 840 1022 H 900" class="edge both"/>

  <rect x="60" y="1143" width="780" height="111" rx="9" class="adapt"/>
  <text x="80" y="1175" class="name">任务结果 / 产物 / 证据引用 · 经校验后供 Agent 汇总交付</text>
  <text x="80" y="1206" class="body">现有诊断结果需通用化；可包含结构化数据、文件和受控证据引用</text>
  <text x="80" y="1234" class="small">信息不足可追问；失败或部分完成有明确状态，不只返回一段文本</text>
  <rect x="900" y="1143" width="240" height="111" rx="9" class="adapt"/>
  <text x="918" y="1175" class="name">已授权资源 / 数据源</text>
  <text x="918" y="1206" class="body">通过后端受控读取</text>
  <text x="918" y="1234" class="small">V1 三服务真实验收仍暂停</text>
  <path d="M 210 1082 V 1143" class="edge"/>
  <path d="M 630 1082 V 1143" class="edge"/>
  <path d="M 1020 1082 V 1143" class="edge both"/>

  <rect x="60" y="1320" width="780" height="111" rx="9" class="reuse"/>
  <text x="80" y="1352" class="name">最终交付与安全投影 · Safe Trace / SSE / 会话留痕</text>
  <text x="80" y="1383" class="body">V1 复用与适配；展示结果、任务状态与实际参与的 Agent / 能力</text>
  <text x="80" y="1411" class="small">不展示隐藏推理、Prompt、原始工具输出或凭据</text>
  <rect x="900" y="1320" width="240" height="111" rx="9" class="reuse"/>
  <text x="918" y="1350" class="name">受控动作闭环</text>
  <text x="918" y="1378" class="body">提案 → 人工审批</text>
  <text x="918" y="1405" class="small">白名单执行 → 独立 Verify</text>
  <path d="M 450 1254 V 1320" class="edge"/>
  <path d="M 60 1374 H 22 V 255 H 420" class="edge optional"/>
  <path d="M 840 708 H 850 V 611 H 1191 V 1290 H 1020 V 1320" class="edge optional"/>
  <text x="975" y="601" class="small">动作提案</text>
  <text x="916" y="1306" class="small">仅已批准动作模板</text>
  <path d="M 900 1375 H 881 V 1220 H 840" class="edge"/>

  <rect x="1230" y="177" width="370" height="1265" rx="12" class="panel"/>
  <text x="1251" y="212" class="section">组件与建设分工</text>
  <rect x="1250" y="238" width="330" height="167" rx="9" class="reuse"/>
  <text x="1271" y="270" class="name">LangGraph · 已有运行底层</text>
  <text x="1271" y="301" class="body">StateGraph / 编排 / ReAct 子图</text>
  <text x="1271" y="331" class="small">V1 已用；四种组合复用图运行机制</text>
  <text x="1271" y="357" class="small">必要时接 checkpoint / interrupt</text>
  <text x="1271" y="383" class="small">运行快照不替代业务 Run / 审批状态</text>

  <rect x="1250" y="433" width="330" height="180" rx="9" class="candidate"/>
  <text x="1271" y="465" class="name">LangChain · 优先评估候选</text>
  <text x="1271" y="497" class="body">create_agent / 结构化输出</text>
  <text x="1271" y="527" class="body">摘要、调用上限等 middleware</text>
  <text x="1271" y="557" class="small">接现有模型配置、mock 与用量统计</text>
  <text x="1271" y="583" class="small">依赖版本与工具执行接缝待验证</text>

  <rect x="1250" y="641" width="330" height="205" rx="9" class="candidate"/>
  <text x="1271" y="673" class="name">Deep Agents · 待比较候选</text>
  <text x="1271" y="705" class="body">Skill 加载 / 上下文管理</text>
  <text x="1271" y="735" class="body">子 Agent 机制 / 能力装配</text>
  <text x="1271" y="766" class="small">不默认与 create_agent 叠加主循环</text>
  <text x="1271" y="792" class="small">兼容 ToolGateway / 安全 Trace</text>
  <text x="1271" y="818" class="small">框架默认工具不自动获得开放权限</text>

  <rect x="1250" y="874" width="330" height="244" rx="9" class="plan"/>
  <text x="1271" y="906" class="name">自有层 · 最小产品契约</text>
  <text x="1271" y="938" class="body">Agent 定义 / Capability 注册</text>
  <text x="1271" y="968" class="body">Task / Result / Artifact 契约</text>
  <text x="1271" y="998" class="body">资源绑定 / 上下文规则</text>
  <text x="1271" y="1028" class="body">主 Agent 间请求与响应</text>
  <text x="1271" y="1059" class="small">会话、模型、网关、审计优先复用 V1</text>
  <text x="1271" y="1085" class="small">新增框架能力不创建第二套业务事实</text>

  <rect x="1250" y="1146" width="330" height="272" rx="9" class="defer"/>
  <text x="1271" y="1178" class="name">后置 · 由实际需求触发</text>
  <text x="1271" y="1210" class="body">完整 Recovery / 分布式调度</text>
  <text x="1271" y="1240" class="body">跨进程协议 / 正式长期记忆</text>
  <text x="1271" y="1270" class="body">工作流编辑器 / 插件市场</text>
  <text x="1271" y="1310" class="small">下一入口：A · 边界与最小契约</text>
  <text x="1271" y="1338" class="small">小范围比较官方组件兼容性</text>
  <text x="1271" y="1366" class="small">随后 B · 主 Agent + 一个能力闭环</text>
  <text x="1271" y="1394" class="small">第二个业务能力检验底座扩展成本</text>

  <line x1="40" y1="1470" x2="1600" y2="1470" stroke="#d4dfe7"/>
  <text x="40" y="1498" class="small">来源：V1 代码与交付记录、V2 计划骨架、LangGraph / LangChain / Deep Agents 官方文档。候选组件尚未引入；详细契约待设计确认。</text>
</svg>
