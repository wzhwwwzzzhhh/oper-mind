<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="950" viewBox="0 0 1480 950" role="img" aria-labelledby="title desc"><title id="title">04 · Capability 与业务工作流</title><desc id="desc">新业务如何以小模块接入？Skill、Tool、Workflow 和 Capability 各负责什么？ V2目标结构，未因配图实施。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5c7181"/></marker><style>
text{font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",sans-serif;fill:#203343}
.title{font-size:30px;font-weight:700}.subtitle{font-size:18px;fill:#526775}
.name{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px;fill:#526775}
.panel{fill:#f7f9fb;stroke:#d6e1e8;stroke-width:1.5}.reuse{fill:#ecf8f4;stroke:#2d7d70;stroke-width:1.8}
.adapt{fill:#edf4fa;stroke:#47758b;stroke-width:1.8}.plan{fill:#fff;stroke:#778b9a;stroke-width:1.8;stroke-dasharray:7 5}
.candidate{fill:#fff8eb;stroke:#a17b36;stroke-width:1.8;stroke-dasharray:7 5}.defer{fill:#f3f4f6;stroke:#95a2ad;stroke-width:1.5;stroke-dasharray:3 5}
.edge{fill:none;stroke:#5c7181;stroke-width:2;marker-end:url(#arrow)}.optional{stroke-dasharray:7 5}.both{marker-start:url(#arrow)}
.life{fill:none;stroke:#b8c8d2;stroke-width:1.5;stroke-dasharray:6 6}.number{font-size:17px;font-weight:700;fill:#526775}
</style></defs><rect width="1480" height="950" fill="#fff"/><text x="40" y="51" class="title">04 · Capability 与业务工作流</text><text x="40" y="88" class="subtitle">新业务如何以小模块接入？Skill、Tool、Workflow 和 Capability 各负责什么？</text><text x="40" y="117" class="small">V2 目标逻辑 / 待设计确认 · 2026-10-09 · 已有、适配、候选按节点文字标注</text><g><rect x="60" y="160" width="285" height="120" rx="10" class="plan"/><text x="82" y="194" class="name" text-anchor="start">主 Agent</text><text x="82" y="227" class="body" text-anchor="start">根据目标选择能力</text><text x="82" y="256" class="body" text-anchor="start">只接触允许的能力目录</text></g><g><rect x="440" y="160" width="960" height="120" rx="10" class="plan"/><text x="462" y="194" class="name" text-anchor="start">Capability · 一项有边界的能力</text><text x="462" y="227" class="body" text-anchor="start">输入 / 输出 / 版本 / 资源依赖 / 完成条件 / 失败语义</text><text x="462" y="256" class="body" text-anchor="start">可封装 Skill、Tool、Workflow 或确定性程序；不要求每种组件都出现</text></g><path d="M 345 220 H 440" class="edge "/><text x="368" y="201" class="small" text-anchor="start">选择</text><g><rect x="60" y="355" width="420" height="125" rx="10" class="plan"/><text x="82" y="389" class="name" text-anchor="start">Skill · 指引与知识</text><text x="82" y="422" class="body" text-anchor="start">提供任务方法与领域信息</text><text x="82" y="451" class="body" text-anchor="start">装配指引不自动获得权限</text></g><g><rect x="530" y="355" width="420" height="125" rx="10" class="plan"/><text x="552" y="389" class="name" text-anchor="start">Tool · 一个受控操作</text><text x="552" y="422" class="body" text-anchor="start">参数与结果有结构</text><text x="552" y="451" class="body" text-anchor="start">访问资源须经过网关</text></g><g><rect x="1000" y="355" width="420" height="125" rx="10" class="plan"/><text x="1022" y="389" class="name" text-anchor="start">Workflow · 一个业务目标</text><text x="1022" y="422" class="body" text-anchor="start">组合必要步骤与已有能力</text><text x="1022" y="451" class="body" text-anchor="start">避免包办多项不相关业务</text></g><path d="M 920 280 V 313 H 270 V 355" class="edge optional"/><path d="M 920 280 V 313 H 740 V 355" class="edge optional"/><path d="M 920 280 V 313 H 1210 V 355" class="edge optional"/><g><rect x="60" y="610" width="420" height="210" rx="10" class="panel"/><text x="82" y="644" class="name" text-anchor="start">拆分原则</text><text x="82" y="677" class="body" text-anchor="start">按独立目标拆分能力</text><text x="82" y="706" class="body" text-anchor="start">一个目标可包含多个步骤</text><text x="82" y="735" class="body" text-anchor="start">可复用小能力组合大任务</text><text x="82" y="764" class="body" text-anchor="start">确定性步骤不额外调用模型</text></g><g><rect x="530" y="585" width="420" height="105" rx="10" class="reuse"/><text x="552" y="619" class="name" text-anchor="start">ToolGateway</text><text x="552" y="652" class="body" text-anchor="start">已有边界复用；工具资格由程序裁决</text></g><g><rect x="530" y="760" width="420" height="85" rx="10" class="adapt"/><text x="552" y="794" class="name" text-anchor="start">已授权资源 / 数据源</text><text x="552" y="827" class="body" text-anchor="start">经确认的 Connector 或读取适配</text></g><path d="M 740 480 V 585" class="edge "/><path d="M 740 690 V 760" class="edge both"/><text x="1000" y="520" class="small" text-anchor="start">例：文档差异能力</text><text x="1000" y="543" class="small" text-anchor="start">（拟议验证样例）</text><g><rect x="1020" y="565" width="380" height="55" rx="10" class="plan"/><text x="1042" y="599" class="name" text-anchor="start">1 · 经网关受控读取文档</text></g><g><rect x="1020" y="642" width="380" height="55" rx="10" class="plan"/><text x="1042" y="676" class="name" text-anchor="start">2 · 模型比较差异</text></g><g><rect x="1020" y="719" width="380" height="55" rx="10" class="plan"/><text x="1042" y="753" class="name" text-anchor="start">3 · 程序校验引用</text></g><g><rect x="1020" y="796" width="380" height="55" rx="10" class="plan"/><text x="1042" y="830" class="name" text-anchor="start">4 · 输出差异与引用</text></g><path d="M 1210 480 V 565" class="edge "/><path d="M 1210 620 V 642" class="edge "/><path d="M 1210 697 V 719" class="edge "/><path d="M 1210 774 V 796" class="edge "/><path d="M 1020 592 H 980 V 637 H 950" class="edge both"/><text x="961" y="578" class="small" text-anchor="start">读工具</text><line x1="40" y1="889" x2="1440" y2="889" stroke="#d6e1e8"/><text x="40" y="919" class="small" text-anchor="start">阅读来源：V2 计划骨架 / V1 基线；图示契约是计划，不代表新增 API、运行状态或外部访问已经实现。</text></svg>
