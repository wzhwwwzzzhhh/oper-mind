</style></defs><rect width="1480" height="1120" fill="#fff"/><text x="40" y="51" class="title">06 · 独立主 Agent 协作与交付责任</text><text x="40" y="88" class="subtitle">两个重要且独立的业务如何联系，同时保留各自责任？</text><text x="40" y="117" class="small">V2 目标逻辑 / 待设计确认 · 2026-10-09 · 已有、适配、候选按节点文字标注</text><path d="M 190 258 V 878" class="life"/><path d="M 740 258 V 878" class="life"/><path d="M 1290 258 V 878" class="life"/><g><rect x="60" y="160" width="260" height="98" rx="10" class="plan"/><text x="82" y="194" class="name" text-anchor="start">主 Agent A / 业务 A</text><text x="82" y="227" class="body" text-anchor="start">自己的任务与上下文</text></g><g><rect x="580" y="160" width="320" height="98" rx="10" class="plan"/><text x="602" y="194" class="name" text-anchor="start">应用协作通道</text><text x="602" y="227" class="body" text-anchor="start">关联请求 / 校验 / 接纳</text></g><g><rect x="1150" y="160" width="280" height="98" rx="10" class="plan"/><text x="1172" y="194" class="name" text-anchor="start">主 Agent B / 业务 B</text><text x="1172" y="227" class="body" text-anchor="start">独立任务与交付责任</text></g><path d="M 190 305 H 740" class="edge "/><text x="465" y="292" class="body" text-anchor="middle">请求候选：目标 / 引用 / 截止条件</text><path d="M 740 343 h 48 v 34 h -48" class="edge"/><text x="805" y="362" class="small" text-anchor="start">校验范围 / 请求关联 / 重复处理</text><path d="M 740 420 H 1290" class="edge "/><text x="1015" y="407" class="body" text-anchor="middle">投递边界明确的协作任务</text><path d="M 1290 480 H 740" class="edge optional"/><text x="1015" y="467" class="body" text-anchor="middle">已受理 / 拒绝 / 需补充</text><path d="M 740 538 H 190" class="edge optional"/><text x="465" y="525" class="body" text-anchor="middle">受理状态，不等于任务完成</text><path d="M 1290 578 h -48 v 34 h 48" class="edge"/><text x="1225" y="597" class="small" text-anchor="end">独立执行，可挂能力或派子任务</text><path d="M 1290 674 H 740" class="edge optional"/><text x="1015" y="661" class="body" text-anchor="middle">结果候选与引用</text><path d="M 740 710 h 48 v 34 h -48" class="edge"/><text x="805" y="729" class="small" text-anchor="start">校验接纳 / 关联响应</text><path d="M 740 788 H 190" class="edge optional"/><text x="465" y="775" class="body" text-anchor="middle">交付结果或明确失败</text><path d="M 190 824 h 48 v 34 h -48" class="edge"/><text x="255" y="843" class="small" text-anchor="start">整合进业务 A 的最终交付</text><rect x="60" y="913" width="1360" height="108" rx="13" class="panel"/><text x="82" y="951" class="name" text-anchor="start">对等业务责任 + 明确请求协议；第一版可在同一后端内验证。</text><text x="82" y="988" class="body" text-anchor="start">只交换必要引用与结果；取消某次请求不默认取消 B 的所有工作，工具执行仍走网关。</text><line x1="40" y1="1059" x2="1440" y2="1059" stroke="#d6e1e8"/><text x="40" y="1089" class="small" text-anchor="start">阅读来源：V2 计划骨架 / V1 基线；图示契约是计划，不代表新增 API、运行状态或外部访问已经实现。</text></svg>
