x="982" y="194" class="name" text-anchor="start">LangGraph · 已有运行底层</text><text x="982" y="227" class="body" text-anchor="start">图、子图、分支与并行编排</text><text x="982" y="256" class="body" text-anchor="start">需要时接恢复组件</text><text x="982" y="285" class="body" text-anchor="start">运行快照不替代业务 Run</text></g><g><rect x="960" y="360" width="440" height="220" rx="10" class="candidate"/><text x="982" y="394" class="name" text-anchor="start">官方生态 · 优先复用候选</text><text x="982" y="427" class="body" text-anchor="start">LangChain create_agent / middleware</text><text x="982" y="456" class="body" text-anchor="start">Deep Agents Skill / 子 Agent / 上下文</text><text x="982" y="485" class="body" text-anchor="start">先验证模型、网关、事件兼容性</text><text x="982" y="514" class="body" text-anchor="start">不默认叠加多个主循环</text></g><g><rect x="960" y="630" width="440" height="195" rx="10" class="plan"/><text x="982" y="664" class="name" text-anchor="start">自有层 · 最小产品契约</text><text x="982" y="697" class="body" text-anchor="start">装配、能力注册、资源与任务契约</text><text x="982" y="726" class="body" text-anchor="start">主 Agent 间请求 / 响应</text><text x="982" y="755" class="body" text-anchor="start">通用机制优先借用成熟组件</text></g><path d="M 960 280 H 919 V 615 H 870" class="edge optional"/><path d="M 960 470 H 910 V 652 H 870" class="edge optional"/><line x1="40" y1="869" x2="1440" y2="869" stroke="#d6e1e8"/><text x="40" y="899" class="small" text-anchor="start">阅读来源：V2 计划骨架 / V1 基线；图示契约是计划，不代表新增 API、运行状态或外部访问已经实现。</text></svg>
