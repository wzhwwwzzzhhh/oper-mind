<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="930" viewBox="0 0 1480 930" role="img" aria-labelledby="title desc"><title id="title">02 · Agent 组合与两个平行维度</title><desc id="desc">四种组合是什么关系？子 Agent 和其他主 Agent 有什么区别？ V2目标结构，未因配图实施。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5c7181"/></marker><style>
text{font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",sans-serif;fill:#203343}
.title{font-size:30px;font-weight:700}.subtitle{font-size:18px;fill:#526775}
.name{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px;fill:#526775}
.panel{fill:#f7f9fb;stroke:#d6e1e8;stroke-width:1.5}.reuse{fill:#ecf8f4;stroke:#2d7d70;stroke-width:1.8}
.adapt{fill:#edf4fa;stroke:#47758b;stroke-width:1.8}.plan{fill:#fff;stroke:#778b9a;stroke-width:1.8;stroke-dasharray:7 5}
.candidate{fill:#fff8eb;stroke:#a17b36;stroke-width:1.8;stroke-dasharray:7 5}.defer{fill:#f3f4f6;stroke:#95a2ad;stroke-width:1.5;stroke-dasharray:3 5}
.edge{fill:none;stroke:#5c7181;stroke-width:2;marker-end:url(#arrow)}.optional{stroke-dasharray:7 5}.both{marker-start:url(#arrow)}
.life{fill:none;stroke:#b8c8d2;stroke-width:1.5;stroke-dasharray:6 6}.number{font-size:17px;font-weight:700;fill:#526775}
</style></defs><rect width="1480" height="930" fill="#fff"/><text x="40" y="51" class="title">02 · Agent 组合与两个平行维度</text><text x="40" y="88" class="subtitle">四种组合是什么关系？子 Agent 和其他主 Agent 有什么区别？</text><text x="40" y="117" class="small">V2 目标逻辑 / 待设计确认 · 2026-10-09 · 已有、适配、候选按节点文字标注</text><rect x="60" y="155" width="650" height="292" rx="13" class="panel"/><rect x="770" y="155" width="650" height="292" rx="13" class="panel"/><rect x="60" y="485" width="650" height="332" rx="13" class="panel"/><rect x="770" y="485" width="650" height="332" rx="13" class="panel"/><text x="82" y="194" class="name" text-anchor="start">组合 1 · 单主 Agent</text><text x="792" y="194" class="name" text-anchor="start">组合 2 · 主 Agent + 技能 / 能力</text><text x="82" y="527" class="name" text-anchor="start">组合 3 · 任务维度：子任务委派</text><text x="792" y="527" class="name" text-anchor="start">组合 4 · 业务维度：独立主 Agent 协作</text><g><rect x="88" y="244" width="145" height="105" rx="10" class="plan"/><text x="110" y="278" class="name" text-anchor="start">用户任务</text><text x="110" y="311" class="body" text-anchor="start">目标与输入</text></g><g><rect x="290" y="244" width="220" height="105" rx="10" class="plan"/><text x="312" y="278" class="name" text-anchor="start">主 Agent</text><text x="312" y="311" class="body" text-anchor="start">完成本次任务</text></g><g><rect x="557" y="244" width="128" height="105" rx="10" class="plan"/><text x="579" y="278" class="name" text-anchor="start">结果</text><text x="579" y="311" class="body" text-anchor="start">交付</text></g><path d="M 233 296 H 290" class="edge "/><path d="M 510 296 H 557" class="edge "/><g><rect x="800" y="244" width="240" height="105" rx="10" class="plan"/><text x="822" y="278" class="name" text-anchor="start">主 Agent</text><text x="822" y="311" class="body" text-anchor="start">保持同一执行主体</text></g><g><rect x="1100" y="244" width="286" height="105" rx="10" class="plan"/><text x="1122" y="278" class="name" text-anchor="start">Skill / Capability</text><text x="1122" y="311" class="body" text-anchor="start">按需提供指引或能力</text></g><path d="M 1100 296 H 1040" class="edge optional"/><text x="82" y="399" class="small" text-anchor="start">基础任务可以由一个执行主体完成。</text><text x="792" y="399" class="small" text-anchor="start">挂载能力本身不会生成另一个 Agent。</text><g><rect x="90" y="592" width="235" height="105" rx="10" class="plan"/><text x="112" y="626" class="name" text-anchor="start">主 Agent / 父任务</text><text x="112" y="659" class="body" text-anchor="start">负责最终交付</text></g><g><rect x="405" y="592" width="275" height="105" rx="10" class="plan"/><text x="427" y="626" class="name" text-anchor="start">子 Agent / 子任务</text><text x="427" y="659" class="body" text-anchor="start">目标与上下文受限</text></g><path d="M 325 645 H 405" class="edge optional both"/><text x="325" y="580" class="small" text-anchor="start">委派 / 回交</text><text x="91" y="744" class="body" text-anchor="start">任务复杂度 / 上下文隔离需要决定是否委派。</text><text x="91" y="779" class="small" text-anchor="start">父任务汇总；共享引擎，独立执行状态。</text><g><rect x="800" y="592" width="250" height="105" rx="10" class="plan"/><text x="822" y="626" class="name" text-anchor="start">主 Agent A</text><text x="822" y="659" class="body" text-anchor="start">业务 A 独立任务</text></g><g><rect x="1140" y="592" width="248" height="105" rx="10" class="plan"/><text x="1162" y="626" class="name" text-anchor="start">主 Agent B</text><text x="1162" y="659" class="body" text-anchor="start">业务 B 独立任务</text></g><path d="M 1050 645 H 1140" class="edge optional both"/><text x="1045" y="580" class="small" text-anchor="start">请求 / 结果</text><text x="801" y="744" class="body" text-anchor="start">业务独立性决定是否分别设置主 Agent。</text><text x="801" y="779" class="small" text-anchor="start">各主 Agent 都能挂能力包、委派自己的子任务。</text><line x1="40" y1="869" x2="1440" y2="869" stroke="#d6e1e8"/><text x="40" y="899" class="small" text-anchor="start">阅读来源：V2 计划骨架 / V1 基线；图示契约是计划，不代表新增 API、运行状态或外部访问已经实现。</text></svg>
