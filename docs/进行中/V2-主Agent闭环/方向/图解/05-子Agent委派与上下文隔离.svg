</style></defs><rect width="1480" height="1010" fill="#fff"/><text x="40" y="51" class="title">05 · 子 Agent 委派与上下文隔离</text><text x="40" y="88" class="subtitle">父任务如何委派？子 Agent 能看到什么？结果由谁交付？</text><text x="40" y="117" class="small">V2 目标逻辑 / 待设计确认 · 2026-10-09 · 已有、适配、候选按节点文字标注</text><path d="M 170 255 V 759" class="life"/><path d="M 550 255 V 759" class="life"/><path d="M 930 255 V 759" class="life"/><path d="M 1310 255 V 759" class="life"/><g><rect x="60" y="160" width="220" height="95" rx="10" class="plan"/><text x="82" y="194" class="name" text-anchor="start" style="font-size:21.6px">主 Agent / 父任务</text><text x="82" y="227" class="body" text-anchor="start">负责目标与最终交付</text></g><g><rect x="420" y="160" width="260" height="95" rx="10" class="plan"/><text x="442" y="194" class="name" text-anchor="start">应用任务控制</text><text x="442" y="227" class="body" text-anchor="start">校验与接纳任务结果</text></g><g><rect x="805" y="160" width="250" height="95" rx="10" class="plan"/><text x="827" y="194" class="name" text-anchor="start">子 Agent / 子任务</text><text x="827" y="227" class="body" text-anchor="start">独立执行状态</text></g><g><rect x="1190" y="160" width="240" height="95" rx="10" class="reuse"/><text x="1212" y="194" class="name" text-anchor="start">ToolGateway</text><text x="1212" y="227" class="body" text-anchor="start">所有工具受控执行</text></g><path d="M 170 305 H 550" class="edge "/><text x="360" y="292" class="body" text-anchor="middle">委派候选：目标 / 输入引用 / 范围</text><path d="M 550 344 h 48 v 34 h -48" class="edge"/><text x="615" y="363" class="small" text-anchor="start">校验 / 预算 / 父子关联</text><path d="M 550 417 H 930" class="edge "/><text x="740" y="404" class="body" text-anchor="middle">选定上下文与允许工具</text><path d="M 930 482 H 1310" class="edge "/><text x="1120" y="469" class="body" text-anchor="middle">受控工具调用</text><path d="M 1310 537 H 930" class="edge optional"/><text x="1120" y="524" class="body" text-anchor="middle">结构化观察 / 证据引用</text><path d="M 930 601 H 550" class="edge optional"/><text x="740" y="588" class="body" text-anchor="middle">结果候选 / 明确失败</text><path d="M 550 639 h 48 v 34 h -48" class="edge"/><text x="615" y="658" class="small" text-anchor="start">校验并接纳子任务结果</text><path d="M 550 710 H 170" class="edge optional"/><text x="360" y="697" class="body" text-anchor="middle">子任务状态与结果引用</text><rect x="60" y="787" width="1360" height="125" rx="13" class="panel"/><text x="82" y="824" class="name" text-anchor="start">父主 Agent 汇总并交付；不是把子 Agent 的原始上下文全部拼回父任务。</text><text x="82" y="862" class="body" text-anchor="start">取消、超时、迟到结果按父子关系处理；共享执行引擎不意味着共享消息、权限或可变状态。</text><line x1="40" y1="949" x2="1440" y2="949" stroke="#d6e1e8"/><text x="40" y="979" class="small" text-anchor="start">阅读来源：V2 计划骨架 / V1 基线；图示契约是计划，不代表新增 API、运行状态或外部访问已经实现。</text></svg>
