<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1010" viewBox="0 0 1480 1010" role="img" aria-labelledby="title desc"><title id="title">05 · 子 Agent 委派与上下文隔离</title><desc id="desc">父任务如何委派？子 Agent 能看到什么？结果由谁交付？ V2目标结构，未因配图实施。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5c7181"/></marker><style>
