</style></defs><rect width="1480" height="1060" fill="#fff"/><text x="40" y="51" class="title">03 · 单次任务与主 Agent 循环</text><text x="40" y="88" class="subtitle">用户发一条消息后，模型、程序和工具分别如何参与？</text><text x="40" y="117" class="small">V2 目标逻辑 / 待设计确认 · 2026-10-09 · 已有、适配、候选按节点文字标注</text><g><rect x="70" y="160" width="360" height="100" rx="10" class="adapt"/><text x="92" y="194" class="name" text-anchor="start">接纳用户消息</text><text x="92" y="227" class="body" text-anchor="start">应用层建立本次任务</text></g><g><rect x="510" y="160" width="450" height="100" rx="10" class="plan"/><text x="532" y="194" class="name" text-anchor="start">装配执行上下文</text><text x="532" y="227" class="body" text-anchor="start">选定能力、资源、模型与输入引用</text></g><g><rect x="1040" y="160" width="360" height="100" rx="10" class="plan"/><text x="1062" y="194" class="name" text-anchor="start">程序检查预算</text><text x="1062" y="227" class="body" text-anchor="start">时间 / 调用次数 / 费用</text></g><g><rect x="1040" y="335" width="360" height="110" rx="10" class="plan"/><text x="1062" y="369" class="name" text-anchor="start">一次模型调用</text><text x="1062" y="402" class="body" text-anchor="start">返回结构化语义决策</text></g><g><rect x="510" y="335" width="450" height="110" rx="10" class="plan"/><text x="532" y="369" class="name" text-anchor="start">程序校验候选</text><text x="532" y="402" class="body" text-anchor="start">schema、注册项、参数与执行资格</text></g><g><rect x="70" y="335" width="360" height="110" rx="10" class="adapt"/><text x="92" y="369" class="name" text-anchor="start">工具 / 能力执行</text><text x="92" y="402" class="body" text-anchor="start">Workflow 或 Tool 经 ToolGateway</text></g><g><rect x="70" y="510" width="360" height="95" rx="10" class="plan"/><text x="92" y="544" class="name" text-anchor="start">结构化观察</text><text x="92" y="577" class="body" text-anchor="start">结果与证据引用进入下一轮</text></g><g><rect x="510" y="630" width="450" height="105" rx="10" class="plan"/><text x="532" y="664" class="name" text-anchor="start">接纳最终结果</text><text x="532" y="697" class="body" text-anchor="start">可交付输出经应用层接纳</text></g><g><rect x="70" y="720" width="360" height="105" rx="10" class="plan"/><text x="92" y="754" class="name" text-anchor="start">需要用户补充</text><text x="92" y="787" class="body" text-anchor="start">等待输入后再装配上下文</text></g><g><rect x="1040" y="630" width="360" height="105" rx="10" class="plan"/><text x="1062" y="664" class="name" text-anchor="start">停止 / 明确失败</text><text x="1062" y="697" class="body" text-anchor="start">预算耗尽、无效或不可执行</text></g><g><rect x="510" y="840" width="450" height="95" rx="10" class="reuse"/><text x="532" y="874" class="name" text-anchor="start">安全展示与留痕</text><text x="532" y="907" class="body" text-anchor="start">结果 / 状态 / Safe Trace</text></g><path d="M 430 210 H 510" class="edge "/><path d="M 960 210 H 1040" class="edge "/><path d="M 1220 260 V 335" class="edge "/><path d="M 1040 390 H 960" class="edge "/><path d="M 510 390 H 430" class="edge "/><text x="455" y="375" class="small" text-anchor="start">调用</text><path d="M 250 445 V 510" class="edge "/><path d="M 70 555 H 38 V 292 H 1220 V 260" class="edge "/><text x="60" y="318" class="small" text-anchor="start">观察后再次检查预算</text><path d="M 735 445 V 630" class="edge "/><text x="752" y="548" class="small" text-anchor="start">可交付</text><path d="M 530 445 V 480 H 480 V 773 H 430" class="edge "/><text x="375" y="689" class="small" text-anchor="start">缺信息</text><path d="M 430 751 H 453 V 279 H 735 V 260" class="edge optional"/><path d="M 960 420 H 1002 V 682 H 1040" class="edge "/><text x="1018" y="590" class="small" text-anchor="start">无效 / 不允许</text><path d="M 1400 210 H 1434 V 682 H 1400" class="edge "/><path d="M 735 735 V 840" class="edge "/><text x="70" y="974" class="small" text-anchor="start">一次判断节点默认一次模型调用；整个任务可能多轮。追问恢复、失败重试与部分完成规则需另行定稿。</text><line x1="40" y1="999" x2="1440" y2="999" stroke="#d6e1e8"/><text x="40" y="1029" class="small" text-anchor="start">阅读来源：V2 计划骨架 / V1 基线；图示契约是计划，不代表新增 API、运行状态或外部访问已经实现。</text></svg>
