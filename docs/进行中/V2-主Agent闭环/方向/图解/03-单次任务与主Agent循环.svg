<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1060" viewBox="0 0 1480 1060" role="img" aria-labelledby="title desc"><title id="title">03 · 单次任务与主 Agent 循环</title><desc id="desc">用户发一条消息后，模型、程序和工具分别如何参与？ V2目标结构，未因配图实施。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5c7181"/></marker><style>
