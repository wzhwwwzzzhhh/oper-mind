<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1280" viewBox="0 0 1480 1280" role="img" aria-labelledby="title desc"><title id="title">08 · 现状资产、候选组件与建设顺序</title><desc id="desc">已有多少？还缺什么？下一步先做什么？ V2目标结构，未因配图实施。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5c7181"/></marker><style>
text{font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",sans-serif;fill:#203343}
.title{font-size:30px;font-weight:700}.subtitle{font-size:18px;fill:#526775}
.name{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px;fill:#526775}
.panel{fill:#f7f9fb;stroke:#d6e1e8;stroke-width:1.5}.reuse{fill:#ecf8f4;stroke:#2d7d70;stroke-width:1.8}
.adapt{fill:#edf4fa;stroke:#47758b;stroke-width:1.8}.plan{fill:#fff;stroke:#778b9a;stroke-width:1.8;stroke-dasharray:7 5}
