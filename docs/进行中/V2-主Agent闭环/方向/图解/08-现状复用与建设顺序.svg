.life{fill:none;stroke:#b8c8d2;stroke-width:1.5;stroke-dasharray:6 6}.number{font-size:17px;font-weight:700;fill:#526775}
</style></defs><rect width="1480" height="1280" fill="#fff"/><text x="40" y="51" class="title">08 · 现状资产、候选组件与建设顺序</text><text x="40" y="88" class="subtitle">已有多少？还缺什么？下一步先做什么？</text><text x="40" y="117" class="small">V2 目标逻辑 / 待设计确认 · 2026-10-09 · 已有、适配、候选按节点文字标注</text><g><rect x="60" y="160" width="420" height="125" rx="10" class="reuse"/><text x="82" y="194" class="name" text-anchor="start">V1 已有 · 优先复用</text><text x="82" y="227" class="body" text-anchor="start">会话 / 模型 / Run / 网关 / 审计</text><text x="82" y="256" class="body" text-anchor="start">LangGraph 与受限运维资产</text></g><g><rect x="530" y="160" width="420" height="125" rx="10" class="adapt"/><text x="552" y="194" class="name" text-anchor="start">已有耦合 · 需要适配</text><text x="552" y="227" class="body" text-anchor="start">诊断结果 / 资源绑定 / Agent 状态</text><text x="552" y="256" class="body" text-anchor="start">旧关键词路由 / 前端信息架构</text></g><g><rect x="1000" y="160" width="420" height="125" rx="10" class="candidate"/><text x="1022" y="194" class="name" text-anchor="start">官方候选 · 尚未采用</text><text x="1022" y="227" class="body" text-anchor="start">create_agent / middleware</text><text x="1022" y="256" class="body" text-anchor="start">Deep Agents 技能与上下文</text></g><g><rect x="60" y="385" width="650" height="135" rx="10" class="plan"/><text x="82" y="419" class="name" text-anchor="start">A · 边界、最小契约与兼容验证</text><text x="82" y="452" class="body" text-anchor="start">定义装配、上下文与任务结果契约</text><text x="82" y="481" class="body" text-anchor="start">验证官方组件接现有模型、网关、Trace</text></g><g><rect x="770" y="385" width="650" height="135" rx="10" class="plan"/><text x="792" y="419" class="name" text-anchor="start">B · 主 Agent + 一个小能力闭环</text><text x="792" y="452" class="body" text-anchor="start">从会话执行、展示结果和状态</text><text x="792" y="481" class="body" text-anchor="start">前后端同步落地，失败与取消可检查</text></g><path d="M 270 285 V 385" class="edge "/><path d="M 740 285 V 330 H 455 V 385" class="edge "/><path d="M 1210 285 V 343 H 633 V 385" class="edge optional"/><path d="M 710 452 H 770" class="edge "/><g><rect x="60" y="615" width="420" height="130" rx="10" class="plan"/><text x="82" y="649" class="name" text-anchor="start">C · 第二个不同业务能力</text><text x="82" y="682" class="body" text-anchor="start">检查共享代码改动与扩展成本</text><text x="82" y="711" class="body" text-anchor="start">业务可扩展性需实际验证</text></g><g><rect x="530" y="615" width="420" height="130" rx="10" class="plan"/><text x="552" y="649" class="name" text-anchor="start">D · 子 Agent 委派</text><text x="552" y="682" class="body" text-anchor="start">父子关联 / 隔离 / 汇总</text><text x="552" y="711" class="body" text-anchor="start">取消、成本与失败传播</text></g><g><rect x="1000" y="615" width="420" height="130" rx="10" class="plan"/><text x="1022" y="649" class="name" text-anchor="start">E · 独立主 Agent 协作</text><text x="1022" y="682" class="body" text-anchor="start">请求 / 响应 / 独立责任</text><text x="1022" y="711" class="body" text-anchor="start">超时、重复与协作深度</text></g><path d="M 1095 520 V 565 H 270 V 615" class="edge "/><path d="M 1095 520 V 565 H 740 V 615" class="edge "/><path d="M 1095 520 V 565 H 1210 V 615" class="edge "/><g><rect x="400" y="850" width="680" height="110" rx="10" class="plan"/><text x="422" y="884" class="name" text-anchor="start">分别验收扩展性与两种协作</text><text x="422" y="917" class="body" text-anchor="start">D 与 E 平行；是否和 C 并行在立项时确认</text></g><path d="M 270 745 V 797 H 740 V 850" class="edge "/><path d="M 740 745 V 850" class="edge "/><path d="M 1210 745 V 797 H 740 V 850" class="edge "/><g><rect x="60" y="1050" width="650" height="95" rx="10" class="plan"/><text x="82" y="1084" class="name" text-anchor="start">F · 按实际需求选择业务深化</text><text x="82" y="1117" class="body" text-anchor="start">用户、数据源、业务效果另行验证</text></g><g><rect x="770" y="1050" width="650" height="95" rx="10" class="defer"/><text x="792" y="1084" class="name" text-anchor="start">后置 · 需求触发后立项</text><text x="792" y="1117" class="body" text-anchor="start">Recovery / 分布式 / 长期记忆 / 编辑器</text></g><path d="M 740 960 V 1000 H 385 V 1050" class="edge "/><path d="M 710 1097 H 770" class="edge optional"/><text x="60" y="1190" class="small" text-anchor="start">V2 尚未实施；P12 代码已合入但真实验收暂停。这里是建议依赖与验收方向，不是时间承诺。</text><text x="815" y="589" class="small">D/E 依赖主循环与最小契约</text><line x1="40" y1="1219" x2="1440" y2="1219" stroke="#d6e1e8"/><text x="40" y="1249" class="small" text-anchor="start">阅读来源：V2 计划骨架 / V1 基线；图示契约是计划，不代表新增 API、运行状态或外部访问已经实现。</text></svg>
