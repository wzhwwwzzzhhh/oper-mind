<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title description">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="description">A cheerful white pelican pedals a coral bicycle along a sunny seaside path.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#8bd5e8"/>
      <stop offset="1" stop-color="#f8e7b9"/>
    </linearGradient>
    <linearGradient id="water" x2="0" y2="1">
      <stop stop-color="#55b9c4"/>
      <stop offset="1" stop-color="#278f9f"/>
    </linearGradient>
    <linearGradient id="bill" x2="1" y2="1">
      <stop stop-color="#ffca63"/>
      <stop offset="1" stop-color="#ef8550"/>
    </linearGradient>
  </defs>

  <!-- Seaside -->
  <rect width="960" height="640" fill="url(#sky)"/>
  <circle cx="781" cy="103" r="57" fill="#fff2af"/>
  <g fill="#fffaf0" opacity=".82">
