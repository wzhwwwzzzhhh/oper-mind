    <circle cx="696" cy="512" r="95" stroke-width="13"/>
    <circle cx="273" cy="512" r="81" stroke="#fbf7e8" stroke-width="3"/>
    <circle cx="696" cy="512" r="81" stroke="#fbf7e8" stroke-width="3"/>
  </g>
  <g stroke="#78939a" stroke-width="2" opacity=".75">
    <path d="M273 417v190m-95-95h190m-162-67 134 134m0-134L206 579"/>
    <path d="M696 417v190m-95-95h190m-162-67 134 134m0-134L629 579"/>
  </g>
  <g fill="none" stroke="#d45755" stroke-linecap="round" stroke-linejoin="round" stroke-width="13">
    <path d="M273 512 417 394 480 512 273 512Z"/>
    <path d="M417 394h189L480 512"/>
    <path d="M606 394 696 512"/>
  </g>
  <g fill="none" stroke="#334b57" stroke-linecap="round" stroke-linejoin="round">
    <path d="m606 394 13-34h48" stroke-width="9"/>
