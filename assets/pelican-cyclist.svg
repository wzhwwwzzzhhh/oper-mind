    <path d="M374 358h69" stroke-width="12"/>
    <path d="m480 512 43 34" stroke-width="7"/>
    <path d="m480 512-40-33" stroke-width="7"/>
    <path d="M510 548h34m-119-73h34" stroke-width="8"/>
  </g>
  <circle cx="273" cy="512" r="12" fill="#334b57"/>
  <circle cx="696" cy="512" r="12" fill="#334b57"/>
  <circle cx="480" cy="512" r="15" fill="#ffe1a0" stroke="#334b57" stroke-width="5"/>

