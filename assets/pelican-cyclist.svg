  </g>
  <path d="M0 352c139-22 215 17 327 1 110-16 221-36 328-10 105 26 206 8 305-13v139H0Z" fill="url(#water)"/>
  <g fill="none" stroke="#c4f0e4" stroke-linecap="round" stroke-width="4" opacity=".6">
