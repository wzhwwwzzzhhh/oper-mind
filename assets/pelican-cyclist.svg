  <path d="M431 289c30 4 51 20 70 40l73 26 42-3c10-1 19 7 19 16 0 9-7 16-17 16l-51-1-94-22c-37-9-63-30-73-52Z" fill="#ebeadd" stroke="#344d55" stroke-width="5" stroke-linejoin="round"/>
