# 配置模板：复制此文件为 config.local.yaml，填入真实值。
#
# 安全建议：优先通过环境变量注入密钥，不要将真实 Key 写入 YAML。
# 诊断模型：OPERMIND_API_KEY / OPERMIND_BASE_URL / OPERMIND_MODEL
# 裁判模型：OPERMIND_JUDGE_API_KEY / OPERMIND_JUDGE_BASE_URL / OPERMIND_JUDGE_MODEL
# 环境变量存在时会覆盖下方同名字段；mock 回归只需设置 OPERMIND_API_KEY=mock。

llm:
  api_key: "your-diagnosis-api-key" # 被测诊断模型的 API Key
  base_url: "https://api.deepseek.com"
  model: "your-diagnosis-model"

judge_llm:
  # 真实评测时必填。可以先与诊断模型共用同一个 API Key，建议选择不同模型名。
  api_key: "your-judge-api-key"
  base_url: "https://api.deepseek.com"
  model: "your-judge-model"
# 应用元数据数据库：Session、Run、Event、Result、幂等与审计。
# 未配置时，开发默认使用仓库根 data/opermind.sqlite3；真实 URL 只放环境变量
# OPERMIND_APP_DATABASE_URL 或被忽略的 config.local.yaml，绝不复用诊断数据源账号。
persistence: {}
# 本地配置示例：
# persistence:
#   database_url: "postgresql+psycopg://opermind:password@db.example/opermind"
