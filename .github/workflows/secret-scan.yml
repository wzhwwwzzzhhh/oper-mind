name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            zricethezav/gitleaks:v8.24.0 \
            detect --source /src --config /src/.gitleaks.toml \
            --no-banner --redact \
            --report-format json --report-path /src/gitleaks-report.json \
            || GITLEAKS_FOUND=1
          if [ -f gitleaks-report.json ]; then
            echo "=== gitleaks findings ==="
            cat gitleaks-report.json
          fi
          if [ "${GITLEAKS_FOUND:-0}" = "1" ]; then
            echo "::error::Secret scan failed. See findings above."
            exit 1
          fi

