# OperMind gitleaks 配置
# 在官方默认规则基础上,补充本项目特定的凭据模式。
title = "OperMind gitleaks config"

[extend]
useDefault = true

# 示例/测试数据中的人为占位符不算泄露
[allowlist]
regexes = [
  '''your-[a-z-]+''',
  '''sk-abcdef123456''',
  '''password=hunter2''',
  # 测试桩/文档中的占位连接串:凭据部分是明显占位词,不带真实凭据
  '''postgres(ql)?(?:\\+[a-z]+)?://(?:u|user|admin|opermind):[^@/'"\s]+@[^/'"\s]+(?:/|$)''',
  '''mysql://(?:u|user|admin|opermind):[^@/'"\s]+@[^/'"\s]+(?:/|$)''',
  '''scheme://u:p@host''',
]

[[rules]]
id = "opermind-deepseek-api-key"
description = "DeepSeek API key (sk- prefix, project config uses DeepSeek)"
regex = '''sk-[A-Za-z0-9]{20,}'''
entropy = 3.0
tags = ["opermind", "llm", "api-key"]

[[rules]]
id = "opermind-postgres-dsn"
description = "PostgreSQL connection string with credentials"
regex = '''postgres(ql)?(\\+[a-z]+)?://[^\\s'" ]+:[^\\s'" ]+@[^\\s'" ]+'''
entropy = 2.0
tags = ["opermind", "postgres", "dsn"]

[[rules]]
id = "opermind-database-url"
description = "Database URL with credentials"
regex = '''(postgresql|mysql|redis|mongodb)(\\+[a-z]+)?://[^\\s'" ]+:[^\\s'" ]+@[^\\s'" ]+'''
entropy = 2.0
tags = ["opermind", "database", "url"]
